name: CI & Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }} | ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22.x", "24.x", "26.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript bundle
        run: npm run build

      - name: Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Native Test Suite
        run: npm test

      - name: Test CLI executable smoke test
        run: |
          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js status

      - name: Verify the npm package ships the built CLI
        run: npm pack --dry-run --json | node -e "const f=JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(x=>x.path); if(!f.includes('dist/index.js')){console.error('dist/index.js missing from package');process.exit(1)}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  # Single stable check for branch protection; matrix job names change with the Node versions.
  ci-result:
    name: CI result
    needs: [test, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.secret-scan.result }}" = success
