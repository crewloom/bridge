name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run build
          npm test

      - name: Publish package to NPM
        run: |
          node -e "
            const raw = process.env.RAW_NPM_TOKEN || '';
            console.log('RAW length:', raw.length);
            console.log('RAW first 5 charCodes:', Array.from(raw.slice(0, 5)).map(c => c.charCodeAt(0)));
            console.log('RAW last 5 charCodes:', Array.from(raw.slice(-5)).map(c => c.charCodeAt(0)));
            const match = raw.match(/npm_[A-Za-z0-9_-]+/) || raw.match(/_authToken\s*=\s*([^\s\r\n\"']+)/);
            const token = match ? (match[1] || match[0]) : raw.trim();
            const clean = token.replace(/[^A-Za-z0-9_.-]/g, '');
            console.log('CLEAN length:', clean.length);
            console.log('CLEAN charCodes min/max:', Math.min(...Array.from(clean).map(c => c.charCodeAt(0))), Math.max(...Array.from(clean).map(c => c.charCodeAt(0))));
            require('fs').writeFileSync(process.env.HOME + '/.npmrc', '//registry.npmjs.org/:_authToken=' + clean + '\n');
            if (process.env.NPM_CONFIG_USERCONFIG) {
              require('fs').writeFileSync(process.env.NPM_CONFIG_USERCONFIG, '//registry.npmjs.org/:_authToken=' + clean + '\n');
            }
          "
          npm whoami || true
          npm publish --access public
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
