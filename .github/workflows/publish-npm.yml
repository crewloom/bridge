name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      otp:
        description: 'NPM 2FA OTP Code (optional, leave empty if using an Automation token)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run build
          npm test

      - name: Publish package to NPM
        run: |
          node -e "
            const raw = process.env.RAW_NPM_TOKEN || '';
            const match = raw.match(/npm_[A-Za-z0-9_-]+/) || raw.match(/_authToken\s*=\s*([^\s\r\n\"']+)/);
            const token = match ? (match[1] || match[0]) : raw.trim();
            const clean = token.replace(/[^A-Za-z0-9_.-]/g, '');
            if (!clean || clean.length < 10) {
              console.error('::error::NPM_TOKEN is invalid or empty. Please set a valid npm access token in GitHub Secrets.');
              process.exit(1);
            }
            require('fs').writeFileSync(process.env.HOME + '/.npmrc', '//registry.npmjs.org/:_authToken=' + clean + '\n');
            if (process.env.NPM_CONFIG_USERCONFIG) {
              require('fs').writeFileSync(process.env.NPM_CONFIG_USERCONFIG, '//registry.npmjs.org/:_authToken=' + clean + '\n');
            }
          "
          if [ -n "${{ github.event.inputs.otp }}" ]; then
            npm publish --access public --otp="${{ github.event.inputs.otp }}"
          else
            npm publish --access public
          fi
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
