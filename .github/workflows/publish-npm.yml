name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: |
          npm run build
          npm test

      - name: Publish package to NPM
        run: |
          CLEAN_TOKEN=$(printf '%s' "${RAW_NPM_TOKEN}" | tr -d '\r\n[:space:]')
          WHOAMI=$(curl -s -H "Authorization: Bearer ${CLEAN_TOKEN}" https://registry.npmjs.org/-/whoami)
          echo "NPM Token Whoami: ${WHOAMI}"
          echo "//registry.npmjs.org/:_authToken=${CLEAN_TOKEN}" > "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          NODE_AUTH_TOKEN="${CLEAN_TOKEN}" npm publish --access public
        env:
          RAW_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
